[package]
name = "enrow"
version = "1.0.0"
edition = "2021"
description = "Official Rust SDK for the Enrow API — find and verify professional emails and phone numbers"
license = "MIT"
repository = "https://github.com/EnrowAPI/enrow-rust"
homepage = "https://enrow.io"
documentation = "https://docs.enrow.io"
keywords = ["enrow", "email-finder", "email-verifier", "phone-finder", "api"]
categories = ["api-bindings"]

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }
thiserror = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
wiremock = "0.6"
